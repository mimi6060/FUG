# =============================================================================
# FUG Project - Telegraf Configuration
# =============================================================================
# Configuration pour la collecte de metriques Docker et systeme
# Utilise avec le profile 'monitoring': make up-monitoring
# =============================================================================

# Configuration globale de Telegraf
[global_tags]
  project = "fug"
  environment = "${_APP_ENV}"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "fug-telegraf"
  omit_hostname = false

# =============================================================================
# OUTPUTS
# =============================================================================

# Sortie vers InfluxDB v2
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
  timeout = "5s"

# =============================================================================
# INPUTS - Metriques Docker
# =============================================================================

# Metriques des containers Docker
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_names = []
  source_tag = false
  container_name_include = ["fug-*"]
  container_name_exclude = []
  timeout = "5s"
  perdevice = true
  total = false
  docker_label_include = []
  docker_label_exclude = []
  tag_env = ["_APP_ENV"]

# =============================================================================
# INPUTS - Metriques Systeme
# =============================================================================

# CPU
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

# Memoire
[[inputs.mem]]
  # pas de configuration specifique

# Disque
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# I/O Disque
[[inputs.diskio]]
  # pas de configuration specifique

# Reseau
[[inputs.net]]
  interfaces = ["eth*", "en*"]
  ignore_protocol_stats = false

# Processus
[[inputs.processes]]
  # pas de configuration specifique

# Uptime systeme
[[inputs.system]]
  # pas de configuration specifique

# =============================================================================
# INPUTS - Metriques Appwrite
# =============================================================================

# Health check Appwrite
[[inputs.http_response]]
  urls = ["http://appwrite/v1/health"]
  response_timeout = "5s"
  method = "GET"
  follow_redirects = false
  [inputs.http_response.tags]
    service = "appwrite"
    check = "health"

# Health check Appwrite DB
[[inputs.http_response]]
  urls = ["http://appwrite/v1/health/db"]
  response_timeout = "5s"
  method = "GET"
  follow_redirects = false
  [inputs.http_response.tags]
    service = "appwrite"
    check = "database"

# Health check Appwrite Cache
[[inputs.http_response]]
  urls = ["http://appwrite/v1/health/cache"]
  response_timeout = "5s"
  method = "GET"
  follow_redirects = false
  [inputs.http_response.tags]
    service = "appwrite"
    check = "cache"

# Health check Appwrite Queue
[[inputs.http_response]]
  urls = ["http://appwrite/v1/health/queue"]
  response_timeout = "5s"
  method = "GET"
  follow_redirects = false
  [inputs.http_response.tags]
    service = "appwrite"
    check = "queue"

# =============================================================================
# INPUTS - Metriques Redis
# =============================================================================

[[inputs.redis]]
  servers = ["tcp://redis:6379"]
  password = ""
  [inputs.redis.tags]
    service = "redis"

# =============================================================================
# INPUTS - Metriques MariaDB
# =============================================================================

[[inputs.mysql]]
  servers = ["${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mariadb:3306)/${MYSQL_DATABASE}"]
  gather_process_list = true
  gather_user_statistics = true
  gather_info_schema_auto_inc = true
  gather_innodb_metrics = true
  gather_slave_status = false
  gather_binary_logs = false
  gather_global_variables = true
  gather_table_io_waits = true
  gather_table_lock_waits = true
  gather_index_io_waits = true
  gather_event_waits = true
  gather_file_events_stats = true
  gather_perf_events_statements = true
  [inputs.mysql.tags]
    service = "mariadb"
