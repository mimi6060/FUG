# =============================================================================
# FUG Project - Appwrite Self-Hosted Infrastructure
# =============================================================================
# Stack complète Appwrite avec MariaDB, Redis, Traefik et monitoring
# Documentation: https://appwrite.io/docs/self-hosting
# =============================================================================

x-logging: &x-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Variables communes pour l'app Flutter
x-flutter-env: &x-flutter-env
  APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-http://localhost/v1}
  APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:-fug}

services:
  # ===========================================================================
  # FUG APP - Flutter Web Application (Production)
  # ===========================================================================
  fug-app-web:
    build:
      context: ../app
      dockerfile: Dockerfile
      args:
        FLUTTER_BUILD_MODE: release
        APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-http://localhost/v1}
        APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:-fug}
    image: fug-app:${APP_VERSION:-latest}
    container_name: fug-app-web
    restart: unless-stopped
    profiles:
      - app
      - full
    depends_on:
      appwrite:
        condition: service_healthy
    networks:
      - fug-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fug-app.rule=Host(`app.${_APP_DOMAIN:-localhost}`)"
      - "traefik.http.routers.fug-app.entrypoints=web"
      - "traefik.http.routers.fug-app.service=fug-app"
      - "traefik.http.routers.fug-app-secure.rule=Host(`app.${_APP_DOMAIN:-localhost}`)"
      - "traefik.http.routers.fug-app-secure.entrypoints=websecure"
      - "traefik.http.routers.fug-app-secure.tls=true"
      - "traefik.http.routers.fug-app-secure.service=fug-app"
      - "traefik.http.services.fug-app.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/v1/health/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    <<: *x-logging

  # ===========================================================================
  # FUG APP DEV - Flutter Web Development (Hot Reload)
  # ===========================================================================
  fug-app-dev:
    build:
      context: ../app
      dockerfile: Dockerfile.dev
    image: fug-app:dev
    container_name: fug-app-dev
    restart: unless-stopped
    profiles:
      - dev
      - app-dev
    environment:
      <<: *x-flutter-env
      FLUTTER_WEB_PORT: 8080
    volumes:
      - ../app:/app:cached
      - flutter-pub-cache:/root/.pub-cache
    ports:
      - "8090:8080"
    networks:
      - fug-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fug-app-dev.rule=Host(`dev.${_APP_DOMAIN:-localhost}`)"
      - "traefik.http.routers.fug-app-dev.entrypoints=web"
      - "traefik.http.routers.fug-app-dev.service=fug-app-dev"
      - "traefik.http.services.fug-app-dev.loadbalancer.server.port=8080"
    stdin_open: true
    tty: true
    <<: *x-logging

  # ===========================================================================
  # FUG FUNCTIONS - Development Container
  # ===========================================================================
  fug-functions-dev:
    build:
      context: ../functions
      dockerfile: Dockerfile.dev
    image: fug-functions:dev
    container_name: fug-functions-dev
    restart: unless-stopped
    profiles:
      - dev
      - functions-dev
    environment:
      NODE_ENV: development
      APPWRITE_FUNCTION_API_ENDPOINT: http://appwrite/v1
      APPWRITE_FUNCTION_PROJECT_ID: ${APPWRITE_PROJECT_ID:-fug}
    volumes:
      - ../functions:/functions:cached
      - functions-node-modules:/functions/node_modules
    networks:
      - fug-network
    stdin_open: true
    tty: true
    <<: *x-logging

  # ===========================================================================
  # TRAEFIK - Reverse Proxy & Load Balancer
  # ===========================================================================
  traefik:
    image: traefik:v3.2
    container_name: fug-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8888:8080"  # Traefik Dashboard
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik:/etc/traefik/dynamic:ro
      - traefik-certificates:/certificates
    networks:
      - fug-network
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    <<: *x-logging

  # ===========================================================================
  # MARIADB - Base de données principale
  # ===========================================================================
  mariadb:
    image: mariadb:10.11
    container_name: fug-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appwrite}
      MYSQL_USER: ${MYSQL_USER:-appwrite}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --innodb-buffer-pool-size=128M
      - --transaction-isolation=READ-COMMITTED
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=128M
      - --innodb-log-file-size=64M
      - --innodb-flush-log-at-trx-commit=2
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - fug-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    <<: *x-logging

  # ===========================================================================
  # REDIS - Cache & Queue
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: fug-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - fug-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    <<: *x-logging

  # ===========================================================================
  # APPWRITE - Backend Principal
  # ===========================================================================
  appwrite:
    image: appwrite/appwrite:1.5.7
    container_name: fug-appwrite
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Core
      _APP_ENV: ${_APP_ENV:-development}
      _APP_LOCALE: ${_APP_LOCALE:-fr}
      _APP_WORKER_PER_CORE: ${_APP_WORKER_PER_CORE:-6}
      _APP_OPTIONS_ABUSE: ${_APP_OPTIONS_ABUSE:-enabled}
      _APP_OPTIONS_FORCE_HTTPS: ${_APP_OPTIONS_FORCE_HTTPS:-disabled}
      _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1}
      # Domain
      _APP_DOMAIN: ${_APP_DOMAIN:-localhost}
      _APP_DOMAIN_TARGET: ${_APP_DOMAIN_TARGET:-localhost}
      _APP_DOMAIN_FUNCTIONS: ${_APP_DOMAIN_FUNCTIONS:-functions.localhost}
      # Console
      _APP_CONSOLE_WHITELIST_ROOT: ${_APP_CONSOLE_WHITELIST_ROOT:-enabled}
      _APP_CONSOLE_WHITELIST_EMAILS: ${_APP_CONSOLE_WHITELIST_EMAILS:-}
      _APP_CONSOLE_WHITELIST_IPS: ${_APP_CONSOLE_WHITELIST_IPS:-}
      # Redis
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_REDIS_USER: ${_APP_REDIS_USER:-}
      _APP_REDIS_PASS: ${_APP_REDIS_PASS:-}
      # Database
      _APP_DB_HOST: mariadb
      _APP_DB_PORT: 3306
      _APP_DB_USER: ${_APP_DB_USER:-appwrite}
      _APP_DB_PASS: ${_APP_DB_PASS:-password}
      _APP_DB_SCHEMA: ${_APP_DB_SCHEMA:-appwrite}
      # Storage
      _APP_STORAGE_LIMIT: ${_APP_STORAGE_LIMIT:-30000000}
      _APP_STORAGE_PREVIEW_LIMIT: ${_APP_STORAGE_PREVIEW_LIMIT:-20000000}
      _APP_STORAGE_ANTIVIRUS: ${_APP_STORAGE_ANTIVIRUS:-disabled}
      _APP_STORAGE_DEVICE: ${_APP_STORAGE_DEVICE:-local}
      _APP_STORAGE_S3_ACCESS_KEY: ${_APP_STORAGE_S3_ACCESS_KEY:-}
      _APP_STORAGE_S3_SECRET: ${_APP_STORAGE_S3_SECRET:-}
      _APP_STORAGE_S3_REGION: ${_APP_STORAGE_S3_REGION:-}
      _APP_STORAGE_S3_BUCKET: ${_APP_STORAGE_S3_BUCKET:-}
      # Functions
      _APP_FUNCTIONS_SIZE_LIMIT: ${_APP_FUNCTIONS_SIZE_LIMIT:-30000000}
      _APP_FUNCTIONS_TIMEOUT: ${_APP_FUNCTIONS_TIMEOUT:-900}
      _APP_FUNCTIONS_BUILD_TIMEOUT: ${_APP_FUNCTIONS_BUILD_TIMEOUT:-900}
      _APP_FUNCTIONS_CPUS: ${_APP_FUNCTIONS_CPUS:-0}
      _APP_FUNCTIONS_MEMORY: ${_APP_FUNCTIONS_MEMORY:-0}
      _APP_FUNCTIONS_RUNTIMES: ${_APP_FUNCTIONS_RUNTIMES:-node-18.0,node-20.0,python-3.11,dart-3.0}
      # SMTP
      _APP_SMTP_HOST: ${_APP_SMTP_HOST:-}
      _APP_SMTP_PORT: ${_APP_SMTP_PORT:-}
      _APP_SMTP_SECURE: ${_APP_SMTP_SECURE:-}
      _APP_SMTP_USERNAME: ${_APP_SMTP_USERNAME:-}
      _APP_SMTP_PASSWORD: ${_APP_SMTP_PASSWORD:-}
      # Logging
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
      # GraphQL
      _APP_GRAPHQL_MAX_BATCH_SIZE: ${_APP_GRAPHQL_MAX_BATCH_SIZE:-10}
      _APP_GRAPHQL_MAX_COMPLEXITY: ${_APP_GRAPHQL_MAX_COMPLEXITY:-250}
      _APP_GRAPHQL_MAX_DEPTH: ${_APP_GRAPHQL_MAX_DEPTH:-3}
      # Maintenance
      _APP_MAINTENANCE_INTERVAL: ${_APP_MAINTENANCE_INTERVAL:-86400}
      _APP_MAINTENANCE_RETENTION_EXECUTION: ${_APP_MAINTENANCE_RETENTION_EXECUTION:-1209600}
      _APP_MAINTENANCE_RETENTION_CACHE: ${_APP_MAINTENANCE_RETENTION_CACHE:-2592000}
      _APP_MAINTENANCE_RETENTION_ABUSE: ${_APP_MAINTENANCE_RETENTION_ABUSE:-86400}
      _APP_MAINTENANCE_RETENTION_AUDIT: ${_APP_MAINTENANCE_RETENTION_AUDIT:-1209600}
      _APP_MAINTENANCE_RETENTION_USAGE_HOURLY: ${_APP_MAINTENANCE_RETENTION_USAGE_HOURLY:-8640000}
      _APP_MAINTENANCE_RETENTION_SCHEDULES: ${_APP_MAINTENANCE_RETENTION_SCHEDULES:-86400}
    volumes:
      - appwrite-uploads:/storage/uploads
      - appwrite-cache:/storage/cache
      - appwrite-config:/storage/config
      - appwrite-certificates:/storage/certificates
      - appwrite-functions:/storage/functions
      - appwrite-builds:/storage/builds
    networks:
      - fug-network
    labels:
      - "traefik.enable=true"
      # HTTP Router
      - "traefik.http.routers.appwrite.rule=Host(`${_APP_DOMAIN:-localhost}`)"
      - "traefik.http.routers.appwrite.entrypoints=web"
      - "traefik.http.routers.appwrite.service=appwrite"
      # HTTPS Router (optionnel)
      - "traefik.http.routers.appwrite-secure.rule=Host(`${_APP_DOMAIN:-localhost}`)"
      - "traefik.http.routers.appwrite-secure.entrypoints=websecure"
      - "traefik.http.routers.appwrite-secure.tls=true"
      - "traefik.http.routers.appwrite-secure.service=appwrite"
      # Service
      - "traefik.http.services.appwrite.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/v1/health/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    <<: *x-logging

  # ===========================================================================
  # APPWRITE REALTIME - WebSocket Server
  # ===========================================================================
  appwrite-realtime:
    image: appwrite/appwrite:1.5.7
    container_name: fug-appwrite-realtime
    restart: unless-stopped
    entrypoint: realtime
    depends_on:
      appwrite:
        condition: service_healthy
    environment:
      _APP_ENV: ${_APP_ENV:-development}
      _APP_WORKER_PER_CORE: ${_APP_WORKER_PER_CORE:-6}
      _APP_OPTIONS_ABUSE: ${_APP_OPTIONS_ABUSE:-enabled}
      _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_DB_HOST: mariadb
      _APP_DB_PORT: 3306
      _APP_DB_USER: ${_APP_DB_USER:-appwrite}
      _APP_DB_PASS: ${_APP_DB_PASS:-password}
      _APP_DB_SCHEMA: ${_APP_DB_SCHEMA:-appwrite}
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
    networks:
      - fug-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.appwrite-realtime.rule=Host(`${_APP_DOMAIN:-localhost}`) && PathPrefix(`/v1/realtime`)"
      - "traefik.http.routers.appwrite-realtime.entrypoints=web,websecure"
      - "traefik.http.routers.appwrite-realtime.service=appwrite-realtime"
      - "traefik.http.services.appwrite-realtime.loadbalancer.server.port=80"
    <<: *x-logging

  # ===========================================================================
  # APPWRITE WORKERS
  # ===========================================================================

  # Worker - Audits
  appwrite-worker-audits:
    image: appwrite/appwrite:1.5.7
    container_name: fug-worker-audits
    restart: unless-stopped
    entrypoint: worker-audits
    depends_on:
      appwrite:
        condition: service_healthy
    environment:
      _APP_ENV: ${_APP_ENV:-development}
      _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_DB_HOST: mariadb
      _APP_DB_PORT: 3306
      _APP_DB_USER: ${_APP_DB_USER:-appwrite}
      _APP_DB_PASS: ${_APP_DB_PASS:-password}
      _APP_DB_SCHEMA: ${_APP_DB_SCHEMA:-appwrite}
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
    networks:
      - fug-network
    <<: *x-logging

  # Worker - Webhooks
  appwrite-worker-webhooks:
    image: appwrite/appwrite:1.5.7
    container_name: fug-worker-webhooks
    restart: unless-stopped
    entrypoint: worker-webhooks
    depends_on:
      appwrite:
        condition: service_healthy
    environment:
      _APP_ENV: ${_APP_ENV:-development}
      _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
    networks:
      - fug-network
    <<: *x-logging

  # Worker - Deletes
  appwrite-worker-deletes:
    image: appwrite/appwrite:1.5.7
    container_name: fug-worker-deletes
    restart: unless-stopped
    entrypoint: worker-deletes
    depends_on:
      appwrite:
        condition: service_healthy
    environment:
      _APP_ENV: ${_APP_ENV:-development}
      _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_DB_HOST: mariadb
      _APP_DB_PORT: 3306
      _APP_DB_USER: ${_APP_DB_USER:-appwrite}
      _APP_DB_PASS: ${_APP_DB_PASS:-password}
      _APP_DB_SCHEMA: ${_APP_DB_SCHEMA:-appwrite}
      _APP_STORAGE_DEVICE: ${_APP_STORAGE_DEVICE:-local}
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
    volumes:
      - appwrite-uploads:/storage/uploads
      - appwrite-cache:/storage/cache
      - appwrite-builds:/storage/builds
      - appwrite-certificates:/storage/certificates
      - appwrite-functions:/storage/functions
    networks:
      - fug-network
    <<: *x-logging

  # Worker - Databases
  appwrite-worker-databases:
    image: appwrite/appwrite:1.5.7
    container_name: fug-worker-databases
    restart: unless-stopped
    entrypoint: worker-databases
    depends_on:
      appwrite:
        condition: service_healthy
    environment:
      _APP_ENV: ${_APP_ENV:-development}
      _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_DB_HOST: mariadb
      _APP_DB_PORT: 3306
      _APP_DB_USER: ${_APP_DB_USER:-appwrite}
      _APP_DB_PASS: ${_APP_DB_PASS:-password}
      _APP_DB_SCHEMA: ${_APP_DB_SCHEMA:-appwrite}
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
    networks:
      - fug-network
    <<: *x-logging

  # Worker - Builds (Functions)
  appwrite-worker-builds:
    image: appwrite/appwrite:1.5.7
    container_name: fug-worker-builds
    restart: unless-stopped
    entrypoint: worker-builds
    depends_on:
      appwrite:
        condition: service_healthy
    environment:
      _APP_ENV: ${_APP_ENV:-development}
      _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_DB_HOST: mariadb
      _APP_DB_PORT: 3306
      _APP_DB_USER: ${_APP_DB_USER:-appwrite}
      _APP_DB_PASS: ${_APP_DB_PASS:-password}
      _APP_DB_SCHEMA: ${_APP_DB_SCHEMA:-appwrite}
      _APP_EXECUTOR_SECRET: ${_APP_EXECUTOR_SECRET:-your-256-bit-secret}
      _APP_EXECUTOR_HOST: http://appwrite-executor/v1
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
    networks:
      - fug-network
    <<: *x-logging

  # Worker - Certificates (SSL)
  appwrite-worker-certificates:
    image: appwrite/appwrite:1.5.7
    container_name: fug-worker-certificates
    restart: unless-stopped
    entrypoint: worker-certificates
    depends_on:
      appwrite:
        condition: service_healthy
    environment:
      _APP_ENV: ${_APP_ENV:-development}
      _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_DB_HOST: mariadb
      _APP_DB_PORT: 3306
      _APP_DB_USER: ${_APP_DB_USER:-appwrite}
      _APP_DB_PASS: ${_APP_DB_PASS:-password}
      _APP_DB_SCHEMA: ${_APP_DB_SCHEMA:-appwrite}
      _APP_DOMAIN: ${_APP_DOMAIN:-localhost}
      _APP_DOMAIN_TARGET: ${_APP_DOMAIN_TARGET:-localhost}
      _APP_DOMAIN_FUNCTIONS: ${_APP_DOMAIN_FUNCTIONS:-functions.localhost}
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
    volumes:
      - appwrite-config:/storage/config
      - appwrite-certificates:/storage/certificates
    networks:
      - fug-network
    <<: *x-logging

  # Worker - Functions
  appwrite-worker-functions:
    image: appwrite/appwrite:1.5.7
    container_name: fug-worker-functions
    restart: unless-stopped
    entrypoint: worker-functions
    depends_on:
      appwrite:
        condition: service_healthy
    environment:
      _APP_ENV: ${_APP_ENV:-development}
      _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_DB_HOST: mariadb
      _APP_DB_PORT: 3306
      _APP_DB_USER: ${_APP_DB_USER:-appwrite}
      _APP_DB_PASS: ${_APP_DB_PASS:-password}
      _APP_DB_SCHEMA: ${_APP_DB_SCHEMA:-appwrite}
      _APP_EXECUTOR_SECRET: ${_APP_EXECUTOR_SECRET:-your-256-bit-secret}
      _APP_EXECUTOR_HOST: http://appwrite-executor/v1
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
    networks:
      - fug-network
    <<: *x-logging

  # Worker - Mails
  appwrite-worker-mails:
    image: appwrite/appwrite:1.5.7
    container_name: fug-worker-mails
    restart: unless-stopped
    entrypoint: worker-mails
    depends_on:
      appwrite:
        condition: service_healthy
    environment:
      _APP_ENV: ${_APP_ENV:-development}
      _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_SMTP_HOST: ${_APP_SMTP_HOST:-}
      _APP_SMTP_PORT: ${_APP_SMTP_PORT:-}
      _APP_SMTP_SECURE: ${_APP_SMTP_SECURE:-}
      _APP_SMTP_USERNAME: ${_APP_SMTP_USERNAME:-}
      _APP_SMTP_PASSWORD: ${_APP_SMTP_PASSWORD:-}
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
    networks:
      - fug-network
    <<: *x-logging

  # Worker - Messaging
  appwrite-worker-messaging:
    image: appwrite/appwrite:1.5.7
    container_name: fug-worker-messaging
    restart: unless-stopped
    entrypoint: worker-messaging
    depends_on:
      appwrite:
        condition: service_healthy
    environment:
      _APP_ENV: ${_APP_ENV:-development}
      _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_DB_HOST: mariadb
      _APP_DB_PORT: 3306
      _APP_DB_USER: ${_APP_DB_USER:-appwrite}
      _APP_DB_PASS: ${_APP_DB_PASS:-password}
      _APP_DB_SCHEMA: ${_APP_DB_SCHEMA:-appwrite}
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
    networks:
      - fug-network
    <<: *x-logging

  # Worker - Migrations
  appwrite-worker-migrations:
    image: appwrite/appwrite:1.5.7
    container_name: fug-worker-migrations
    restart: unless-stopped
    entrypoint: worker-migrations
    depends_on:
      appwrite:
        condition: service_healthy
    environment:
      _APP_ENV: ${_APP_ENV:-development}
      _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_DB_HOST: mariadb
      _APP_DB_PORT: 3306
      _APP_DB_USER: ${_APP_DB_USER:-appwrite}
      _APP_DB_PASS: ${_APP_DB_PASS:-password}
      _APP_DB_SCHEMA: ${_APP_DB_SCHEMA:-appwrite}
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
    networks:
      - fug-network
    <<: *x-logging

  # Executor - Functions Runtime
  appwrite-executor:
    image: appwrite/appwrite:1.5.7
    container_name: fug-appwrite-executor
    restart: unless-stopped
    entrypoint: executor
    stop_signal: SIGINT
    depends_on:
      appwrite:
        condition: service_healthy
    environment:
      _APP_ENV: ${_APP_ENV:-development}
      _APP_VERSION: ${_APP_VERSION:-latest}
      _APP_EXECUTOR_SECRET: ${_APP_EXECUTOR_SECRET:-your-256-bit-secret}
      _APP_FUNCTIONS_RUNTIMES: ${_APP_FUNCTIONS_RUNTIMES:-node-18.0,node-20.0,python-3.11,dart-3.0}
      _APP_FUNCTIONS_CPUS: ${_APP_FUNCTIONS_CPUS:-0}
      _APP_FUNCTIONS_MEMORY: ${_APP_FUNCTIONS_MEMORY:-0}
      _APP_FUNCTIONS_TIMEOUT: ${_APP_FUNCTIONS_TIMEOUT:-900}
      _APP_FUNCTIONS_BUILD_TIMEOUT: ${_APP_FUNCTIONS_BUILD_TIMEOUT:-900}
      _APP_FUNCTIONS_INACTIVE_THRESHOLD: ${_APP_FUNCTIONS_INACTIVE_THRESHOLD:-60}
      _APP_STORAGE_DEVICE: ${_APP_STORAGE_DEVICE:-local}
      OPR_EXECUTOR_NETWORK: fug-network
      OPEN_RUNTIMES_NETWORK: fug-network
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appwrite-builds:/storage/builds
      - appwrite-functions:/storage/functions
      - /tmp:/tmp:rw
    networks:
      - fug-network
    <<: *x-logging

  # Scheduler - Cron Jobs
  appwrite-scheduler-functions:
    image: appwrite/appwrite:1.5.7
    container_name: fug-scheduler-functions
    restart: unless-stopped
    entrypoint: schedule-functions
    depends_on:
      appwrite:
        condition: service_healthy
    environment:
      _APP_ENV: ${_APP_ENV:-development}
      _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_DB_HOST: mariadb
      _APP_DB_PORT: 3306
      _APP_DB_USER: ${_APP_DB_USER:-appwrite}
      _APP_DB_PASS: ${_APP_DB_PASS:-password}
      _APP_DB_SCHEMA: ${_APP_DB_SCHEMA:-appwrite}
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
    networks:
      - fug-network
    <<: *x-logging

  appwrite-scheduler-messages:
    image: appwrite/appwrite:1.5.7
    container_name: fug-scheduler-messages
    restart: unless-stopped
    entrypoint: schedule-messages
    depends_on:
      appwrite:
        condition: service_healthy
    environment:
      _APP_ENV: ${_APP_ENV:-development}
      _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_DB_HOST: mariadb
      _APP_DB_PORT: 3306
      _APP_DB_USER: ${_APP_DB_USER:-appwrite}
      _APP_DB_PASS: ${_APP_DB_PASS:-password}
      _APP_DB_SCHEMA: ${_APP_DB_SCHEMA:-appwrite}
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
    networks:
      - fug-network
    <<: *x-logging

  # Maintenance Worker
  appwrite-maintenance:
    image: appwrite/appwrite:1.5.7
    container_name: fug-maintenance
    restart: unless-stopped
    entrypoint: maintenance
    depends_on:
      appwrite:
        condition: service_healthy
    environment:
      _APP_ENV: ${_APP_ENV:-development}
      _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_DB_HOST: mariadb
      _APP_DB_PORT: 3306
      _APP_DB_USER: ${_APP_DB_USER:-appwrite}
      _APP_DB_PASS: ${_APP_DB_PASS:-password}
      _APP_DB_SCHEMA: ${_APP_DB_SCHEMA:-appwrite}
      _APP_MAINTENANCE_INTERVAL: ${_APP_MAINTENANCE_INTERVAL:-86400}
      _APP_MAINTENANCE_RETENTION_EXECUTION: ${_APP_MAINTENANCE_RETENTION_EXECUTION:-1209600}
      _APP_MAINTENANCE_RETENTION_CACHE: ${_APP_MAINTENANCE_RETENTION_CACHE:-2592000}
      _APP_MAINTENANCE_RETENTION_ABUSE: ${_APP_MAINTENANCE_RETENTION_ABUSE:-86400}
      _APP_MAINTENANCE_RETENTION_AUDIT: ${_APP_MAINTENANCE_RETENTION_AUDIT:-1209600}
      _APP_MAINTENANCE_RETENTION_USAGE_HOURLY: ${_APP_MAINTENANCE_RETENTION_USAGE_HOURLY:-8640000}
      _APP_MAINTENANCE_RETENTION_SCHEDULES: ${_APP_MAINTENANCE_RETENTION_SCHEDULES:-86400}
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
    networks:
      - fug-network
    <<: *x-logging

  # Worker - Usage
  appwrite-worker-usage:
    image: appwrite/appwrite:1.5.7
    container_name: fug-worker-usage
    restart: unless-stopped
    entrypoint: worker-usage
    depends_on:
      appwrite:
        condition: service_healthy
    environment:
      _APP_ENV: ${_APP_ENV:-development}
      _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_DB_HOST: mariadb
      _APP_DB_PORT: 3306
      _APP_DB_USER: ${_APP_DB_USER:-appwrite}
      _APP_DB_PASS: ${_APP_DB_PASS:-password}
      _APP_DB_SCHEMA: ${_APP_DB_SCHEMA:-appwrite}
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
    networks:
      - fug-network
    <<: *x-logging

  # Usage Dump Worker
  appwrite-usage:
    image: appwrite/appwrite:1.5.7
    container_name: fug-appwrite-usage
    restart: unless-stopped
    entrypoint: usage
    depends_on:
      appwrite:
        condition: service_healthy
    environment:
      _APP_ENV: ${_APP_ENV:-development}
      _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_DB_HOST: mariadb
      _APP_DB_PORT: 3306
      _APP_DB_USER: ${_APP_DB_USER:-appwrite}
      _APP_DB_PASS: ${_APP_DB_PASS:-password}
      _APP_DB_SCHEMA: ${_APP_DB_SCHEMA:-appwrite}
      _APP_LOGGING_PROVIDER: ${_APP_LOGGING_PROVIDER:-}
      _APP_LOGGING_CONFIG: ${_APP_LOGGING_CONFIG:-}
    networks:
      - fug-network
    <<: *x-logging

  # ===========================================================================
  # MONITORING (Optionnel - Telegraf + InfluxDB)
  # ===========================================================================

  influxdb:
    image: influxdb:2.7-alpine
    container_name: fug-influxdb
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-adminpassword}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-fug}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-appwrite}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-your-super-secret-token}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    ports:
      - "8086:8086"
    networks:
      - fug-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    <<: *x-logging

  telegraf:
    image: telegraf:1.28-alpine
    container_name: fug-telegraf
    restart: unless-stopped
    profiles:
      - monitoring
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      HOST_ETC: /hostfs/etc
      HOST_PROC: /hostfs/proc
      HOST_SYS: /hostfs/sys
      HOST_VAR: /hostfs/var
      HOST_RUN: /hostfs/run
      HOST_MOUNT_PREFIX: /hostfs
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
    networks:
      - fug-network
    <<: *x-logging

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  fug-network:
    name: fug-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  # Traefik
  traefik-certificates:
    name: fug-traefik-certificates

  # MariaDB
  mariadb-data:
    name: fug-mariadb-data

  # Redis
  redis-data:
    name: fug-redis-data

  # Appwrite
  appwrite-uploads:
    name: fug-appwrite-uploads
  appwrite-cache:
    name: fug-appwrite-cache
  appwrite-config:
    name: fug-appwrite-config
  appwrite-certificates:
    name: fug-appwrite-certificates
  appwrite-functions:
    name: fug-appwrite-functions
  appwrite-builds:
    name: fug-appwrite-builds

  # InfluxDB (monitoring)
  influxdb-data:
    name: fug-influxdb-data
  influxdb-config:
    name: fug-influxdb-config

  # Flutter App (dev)
  flutter-pub-cache:
    name: fug-flutter-pub-cache

  # Functions (dev)
  functions-node-modules:
    name: fug-functions-node-modules
