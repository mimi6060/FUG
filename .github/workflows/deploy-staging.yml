name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      deploy_app:
        description: 'Deploy Flutter app'
        required: false
        default: true
        type: boolean
      deploy_functions:
        description: 'Deploy Functions'
        required: false
        default: true
        type: boolean

env:
  FLUTTER_VERSION: '3.24.0'
  NODE_VERSION: '18'
  APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID_STAGING }}
  APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT_STAGING }}

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha_short: ${{ steps.sha.outputs.sha_short }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Generate version
        id: version
        run: echo "version=0.0.0-staging.$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

  deploy-functions:
    name: Deploy Functions to Staging
    runs-on: ubuntu-latest
    needs: prepare
    if: github.event_name == 'push' || inputs.deploy_functions
    strategy:
      fail-fast: false
      matrix:
        function:
          - name: follow-user
            runtime: node-18.0
          - name: join-event
            runtime: node-18.0
          - name: create-event
            runtime: node-18.0
          - name: gamification
            runtime: dart-3.4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: startsWith(matrix.function.runtime, 'node')
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/${{ matrix.function.name }}/package-lock.json

      - name: Setup Dart
        if: startsWith(matrix.function.runtime, 'dart')
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.4.0'

      - name: Install Appwrite CLI
        run: npm install -g appwrite-cli

      - name: Configure Appwrite CLI
        run: |
          appwrite client \
            --endpoint ${{ env.APPWRITE_ENDPOINT }} \
            --projectId ${{ env.APPWRITE_PROJECT_ID }} \
            --key ${{ secrets.APPWRITE_API_KEY_STAGING }}

      - name: Install dependencies (Node.js)
        if: startsWith(matrix.function.runtime, 'node')
        run: npm ci
        working-directory: functions/${{ matrix.function.name }}

      - name: Install dependencies (Dart)
        if: startsWith(matrix.function.runtime, 'dart')
        run: dart pub get
        working-directory: functions/${{ matrix.function.name }}

      - name: Deploy function
        run: |
          appwrite functions createDeployment \
            --functionId ${{ matrix.function.name }} \
            --entrypoint 'src/main.js' \
            --code functions/${{ matrix.function.name }} \
            --activate true
        env:
          APPWRITE_KEY: ${{ secrets.APPWRITE_API_KEY_STAGING }}

      - name: Notify deployment
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Function ${{ matrix.function.name }} deployed to staging: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Function Deployment*\n*Function:* ${{ matrix.function.name }}\n*Environment:* Staging\n*Status:* ${{ job.status }}\n*Version:* ${{ needs.prepare.outputs.version }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  build-app-android:
    name: Build Android for Staging
    runs-on: ubuntu-latest
    needs: prepare
    if: github.event_name == 'push' || inputs.deploy_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: app

      - name: Create staging env file
        run: |
          cat > .env.staging << EOF
          APPWRITE_ENDPOINT=${{ env.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID=${{ env.APPWRITE_PROJECT_ID }}
          ENVIRONMENT=staging
          VERSION=${{ needs.prepare.outputs.version }}
          EOF
        working-directory: app

      - name: Build APK for staging
        run: |
          flutter build apk \
            --release \
            --dart-define=ENVIRONMENT=staging \
            --dart-define=VERSION=${{ needs.prepare.outputs.version }} \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ github.run_number }}
        working-directory: app

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-staging-android-${{ needs.prepare.outputs.sha_short }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-app-ios:
    name: Build iOS for Staging
    runs-on: macos-latest
    needs: prepare
    if: github.event_name == 'push' || inputs.deploy_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: app

      - name: Create staging env file
        run: |
          cat > .env.staging << EOF
          APPWRITE_ENDPOINT=${{ env.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID=${{ env.APPWRITE_PROJECT_ID }}
          ENVIRONMENT=staging
          VERSION=${{ needs.prepare.outputs.version }}
          EOF
        working-directory: app

      - name: Build iOS for staging
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define=ENVIRONMENT=staging \
            --dart-define=VERSION=${{ needs.prepare.outputs.version }}
        working-directory: app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-staging-ios-${{ needs.prepare.outputs.sha_short }}
          path: app/build/ios/iphoneos/
          retention-days: 30

  distribute-staging:
    name: Distribute to Staging Testers
    runs-on: ubuntu-latest
    needs: [prepare, build-app-android, build-app-ios]
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: app-staging-android-${{ needs.prepare.outputs.sha_short }}
          path: android-build

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID_STAGING }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: staging-testers
          file: android-build/app-release.apk
          releaseNotes: |
            Staging Build
            Version: ${{ needs.prepare.outputs.version }}
            Commit: ${{ needs.prepare.outputs.sha_short }}

  notify-staging:
    name: Notify Staging Deployment
    runs-on: ubuntu-latest
    needs: [prepare, deploy-functions, distribute-staging]
    if: always()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Staging deployment completed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Staging Deployment Summary"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ needs.prepare.outputs.version }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ needs.prepare.outputs.sha_short }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Functions:*\n${{ needs.deploy-functions.result }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*App Distribution:*\n${{ needs.distribute-staging.result }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
